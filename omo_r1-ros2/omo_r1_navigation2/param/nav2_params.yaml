# ===== AMCL: LiDAR 기반 위치추정 =====
amcl:
  ros__parameters:
    use_sim_time: False                # 시뮬레이션 시간을 쓰는 경우 true
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: "base_footprint"    # 로봇 베이스 링크 이름
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 10.0
    laser_min_range: 0.12
    laser_model_type: "likelihood_field"
    max_beams: 60
    max_particles: 3000
    min_particles: 500
    odom_frame_id: "odom"              # 오도메트리 프레임 이름
    pf_err: 0.05
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    sigma_hit: 0.2
    tf_broadcast: true
    transform_tolerance: 0.3          # TF 지연 허용치(초) → 지연이 크면 0.3~0.5로 증가
    update_min_a: 0.2
    update_min_d: 0.25
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: scan_filtered          # 필터 적용된 레이저 토픽
    set_initial_pose: true             # 시작 시 초기 포즈 적용 여부
    initial_pose: [0.0, 0.0, 0.0]      # AMCL 기본 초기 포즈 [x, y, yaw]

amcl_map_client:
  ros__parameters:
    use_sim_time: False

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: False

bt_navigator:
  ros__parameters:
    use_sim_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
      default_nav_to_pose_bt_xml: "navigate_w_replanning_and_recovery.xml"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
      default_nav_through_poses_bt_xml: "navigate_through_poses_w_replanning_and_recovery.xml"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: False

# ===== Controller Server (DWB 로컬 플래너) =====
controller_server:
  ros__parameters:
    use_sim_time: False
    controller_frequency: 20.0         # 제어 루프 주기(Hz)
    min_x_velocity_threshold: 0.001    # 이 값 미만 속도는 0으로 간주
    min_y_velocity_threshold: 0.0      # 차륜 로봇은 Y축 움직임이 없어 0.0 유지
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.4   # 10초 동안
      movement_time_allowance: 10.0   # 0.4m 반경을 못 벗어나면 멈춘 것으로 간주

    # 목표 지점에 "도착"했는지 판단
    goal_checker_plugins: ["general_goal_checker"] 
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25     # DWB의 xy_goal_tolerance와 맞춤
      yaw_goal_tolerance: 0.2    # (예시) 0.2 라디안 (약 11.5도)
      stateful: True

    #localplanner parameters
    FollowPath:
      # plugin: "nav2_mppi_controller::MPPIController"
      # 
      # # 예측 지평/샘플링
      # time_steps: 36
      # model_dt: 0.05
      # batch_size: 1500
      # iteration_count: 1
      #
      # # 기구학 제한
      # vx_max: 1.0
      # vx_min: -0.2
      # wz_max: 1.0
      # ax_max: 2.8
      # ax_min: -1.0
      # az_max: 2.5
      # motion_model: "DiffDrive"
      #
      # # 경로 추종 관련
      # transform_tolerance: 0.3
      # prune_distance: 2.0
      #
      # # 시각화 (튜닝 시 유용)
      # visualize: true
      #
      # # Critic 설정
      # critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic", "PathAlignCritic", "PathFollowCritic", "PreferForwardCritic", "ObstaclesCritic"]
      #
      # ConstraintCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 2.0
      #
      # GoalCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 4.0
      #   threshold_to_consider: 1.2
      #
      # GoalAngleCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 2.0
      #   threshold_to_consider: 0.6
      #
      # PreferForwardCritic:
      #   enabled: true
      #   cost_power: 2
      #   cost_weight: 7.0
      #   threshold_to_consider: 0.6
      #
      # CostCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 2.0
      #   critical_cost: 450.0
      #   consider_footprint: true
      #   collision_cost: 10000.0
      #   near_goal_distance: 0.4
      #
      # PathAlignCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 9.0
      #   threshold_to_consider: 0.5
      #   max_path_occupancy_ratio: 0.3
      #
      # PathFollowCritic:
      #   enabled: true
      #   cost_power: 1
      #   cost_weight: 4.0
      #   threshold_to_consider: 1.2
      #
      # ObstaclesCritic:
      #   enabled: true
      #   cost_power: 1
      #   critical_weight: 18.0
      #   repulsion_weight: 1.2
      #   collision_cost: 10000.0
      #   collision_margin_distance: 0.15
      #   inflation_radius: 0.55
      #   cost_scaling_factor: 10.0
      #   near_goal_distance: 0.5
      #   consider_footprint: true

      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: True
      min_vel_x: -0.2
      min_vel_y: 0.0
      max_vel_x: 0.2
      max_vel_y: 0.0
      max_vel_theta: 1.0
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
